<app-navbar></app-navbar>

<div
  class="page-header page-header-hero"
  style="background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1800&q=85');"
>
  <div class="page-header-fade"></div>
  <div class="container page-header-content">
    <h1 class="section-title mb-1">My Bookings</h1>
    <p class="mb-0" style="color: var(--text-muted)">Manage your upcoming and past trips</p>
  </div>
</div>

<div class="container section-py pt-0 px-3">
  <div class="alert alert-info" *ngIf="message">{{ message }}</div>

  <div class="empty-state" *ngIf="bookings.length === 0">
    <i class="bi bi-suitcase"></i>
    <p class="mt-2 mb-3">You don't have any bookings yet</p>
    <a routerLink="/booking" class="btn btn-wanderly">Book a Trip</a>
  </div>

  <div class="row g-4 mx-0" *ngIf="bookings.length > 0">
    <div class="col-md-6 col-lg-4 px-2 px-sm-3" *ngFor="let booking of bookings">
      <div class="destination-card">
        <div class="img-wrap">
          <img [src]="booking.tripImage" [alt]="booking.tripTitle" />
          <span class="badge-tag" [ngClass]="statusClass(booking.status)">
            {{ booking.status }}
          </span>
        </div>
        <div class="card-body-info">
          <h6 class="mb-1" style="color: var(--text-heading)">{{ booking.tripTitle }}</h6>
          <p class="mb-2" style="color: var(--text-muted); font-size: .8rem">
            <i class="bi bi-geo-alt"></i> {{ booking.destination }}
          </p>
          <div class="d-flex justify-content-between mb-1" style="font-size: .8rem; color: var(--text-body)">
            <span><i class="bi bi-calendar"></i> {{ booking.travelDate }}</span>
            <span><i class="bi bi-people"></i> {{ booking.adults }} Adults, {{ booking.children }} Children</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <strong style="color: var(--brand-primary)">${{ booking.totalPrice }}</strong>
            <button
              class="btn btn-wanderly-outline btn-sm"
              *ngIf="booking.status === 'upcoming'"
              (click)="cancelBooking(booking.id)"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
